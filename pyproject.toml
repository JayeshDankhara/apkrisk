[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apkrisk"
version = "0.1.0"
description = "Explainable static malware risk scoring for Android APKs, using tiny Pareto-optimal ML models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Jayesh Dankhara", email = "jayesh17296@gmail.com" }]
keywords = ["android", "malware", "apk", "security", "machine-learning", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["androguard>=4.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
apkrisk = "apkrisk.cli:main"

[project.urls]
Homepage = "https://github.com/JayeshDankhara/apkrisk"
Research = "https://github.com/JayeshDankhara/AndroidMalwareDetector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"apkrisk.data" = ["*.json"]
